name: Deploy RepCycle to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          mkdir _site
          cp index.html styles.css _site/
          node -e 'const fs=require("fs"); const config=JSON.parse(process.env.FIREBASE_CONFIG_JSON || "{}"); if (!config.apiKey || !config.projectId || !config.appId) throw new Error("Add the FIREBASE_CONFIG_JSON repository secret"); fs.writeFileSync("_site/firebase-config.local.js", "export const firebaseConfig = " + JSON.stringify(config) + ";\n");'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
